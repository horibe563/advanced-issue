<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ユーザマスタ | 在庫管理</title>
  <link rel="stylesheet" href="/style.css">
  <!-- helmet の CSP（script-src 'self'）に合わせ、スクリプトは外部ファイルのみ読み込む -->
  <script type="module" src="/js/users.js"></script>
</head>
<body>
  <header class="site-header">
    <p class="site-title">在庫管理</p>
    <nav aria-label="メインメニュー">
      <ul class="nav-list">
        <li><a href="/index.html">在庫状況</a></li>
        <li><a href="/form.html">商品登録・入出庫登録</a></li>
        <!-- 管理者のみ表示するメニュー（js/auth.js が他の画面にも追加する） -->
        <li data-admin-menu><a href="/users.html" aria-current="page">ユーザマスタ</a></li>
      </ul>
    </nav>
    <!-- ログインユーザ名・ログアウト（js/auth.js が表示する） -->
    <div id="header-user" class="header-user" hidden></div>
  </header>

  <main class="container">
    <h1>ユーザマスタ</h1>

    <!-- 操作結果・エラーの表示領域 -->
    <div id="page-message" class="message" hidden></div>

    <!-- 初期表示は検索窓のみ（要件）。管理者以外は js/users.js が隠す -->
    <section class="card" id="search-section" aria-labelledby="search-heading">
      <h2 id="search-heading">検索</h2>
      <form id="search-form" class="search-form" novalidate>
        <div class="field">
          <label for="search-user-id">ユーザID（部分一致）</label>
          <input type="search" id="search-user-id" name="user_id" maxlength="50" autocomplete="off">
          <div class="field-error" data-error-for="user_id" hidden></div>
        </div>
        <div class="field">
          <label for="search-user-name">氏名（部分一致）</label>
          <input type="search" id="search-user-name" name="user_name" maxlength="100" autocomplete="off">
          <div class="field-error" data-error-for="user_name" hidden></div>
        </div>
        <div class="actions">
          <button type="submit" id="search-button" class="btn btn-primary">検索</button>
          <button type="button" id="search-clear" class="btn">条件をクリア</button>
          <button type="button" id="register-open" class="btn">ユーザを登録する</button>
        </div>
      </form>
      <p class="hint">条件を空欄のまま検索すると、すべてのユーザを表示します。</p>
    </section>

    <!-- 検索結果（検索するまで表示しない） -->
    <section class="card" id="result-section" aria-labelledby="list-heading" hidden>
      <div class="section-header">
        <h2 id="list-heading">ユーザ一覧</h2>
        <div class="section-tools">
          <button type="button" id="reload-button" class="btn btn-small">再読み込み</button>
        </div>
      </div>
      <p id="list-summary" class="summary" aria-live="polite"></p>
      <div class="table-wrap">
        <table class="data-table">
          <thead>
            <tr>
              <th scope="col">ユーザID</th>
              <th scope="col">氏名</th>
              <th scope="col">ロール</th>
              <th scope="col">更新日時</th>
              <th scope="col">操作</th>
            </tr>
          </thead>
          <tbody id="user-body"></tbody>
        </table>
      </div>
      <div class="pager">
        <button type="button" id="prev-page" class="btn btn-small" disabled>前の100件</button>
        <span id="page-info"></span>
        <button type="button" id="next-page" class="btn btn-small" disabled>次の100件</button>
      </div>
    </section>
  </main>

  <!-- ユーザ登録の子画面 -->
  <dialog id="register-dialog" class="dialog dialog-narrow" aria-labelledby="register-title">
    <div class="dialog-body">
      <div class="dialog-header">
        <h2 id="register-title">ユーザ登録</h2>
        <button type="button" class="btn btn-small" data-close-dialog>閉じる</button>
      </div>
      <div id="register-message" class="message" hidden></div>
      <form id="register-form" novalidate>
        <div class="field">
          <label for="r-user-id">ユーザID <span class="required">必須</span></label>
          <input type="text" id="r-user-id" name="user_id" maxlength="50" autocomplete="off" aria-describedby="r-user-id-hint">
          <small id="r-user-id-hint" class="hint">半角英数字と . _ - のみ、50文字以内。登録後は変更できません（削除済みのIDも再利用できません）</small>
          <div class="field-error" data-error-for="user_id" hidden></div>
        </div>
        <div class="field">
          <label for="r-user-name">氏名 <span class="required">必須</span></label>
          <input type="text" id="r-user-name" name="user_name" maxlength="100" autocomplete="off">
          <div class="field-error" data-error-for="user_name" hidden></div>
        </div>
        <div class="field">
          <label for="r-role">ロール <span class="required">必須</span></label>
          <select id="r-role" name="role">
            <option value="general">一般</option>
            <option value="admin">管理者</option>
          </select>
          <div class="field-error" data-error-for="role" hidden></div>
        </div>
        <div class="field">
          <label for="r-password">パスワード <span class="required">必須</span></label>
          <input type="password" id="r-password" name="password" autocomplete="new-password" aria-describedby="r-password-hint">
          <small id="r-password-hint" class="hint">8文字以上</small>
          <div class="field-error" data-error-for="password" hidden></div>
        </div>
        <div class="field">
          <label for="r-password-confirm">パスワード（確認） <span class="required">必須</span></label>
          <input type="password" id="r-password-confirm" name="password_confirm" autocomplete="new-password">
          <div class="field-error" data-error-for="password_confirm" hidden></div>
        </div>
        <div class="actions">
          <button type="submit" id="register-submit" class="btn btn-primary">登録</button>
          <button type="button" class="btn" data-close-dialog>キャンセル</button>
        </div>
      </form>
    </div>
  </dialog>

  <!-- パスワード設定の子画面 -->
  <dialog id="password-dialog" class="dialog dialog-narrow" aria-labelledby="password-title">
    <div class="dialog-body">
      <div class="dialog-header">
        <h2 id="password-title">パスワード設定</h2>
        <button type="button" class="btn btn-small" data-close-dialog>閉じる</button>
      </div>
      <p id="password-target" class="summary"></p>
      <div id="password-message" class="message" hidden></div>
      <form id="password-form" novalidate>
        <div class="field">
          <label for="pw-password">新しいパスワード <span class="required">必須</span></label>
          <input type="password" id="pw-password" name="password" autocomplete="new-password" aria-describedby="pw-password-hint">
          <small id="pw-password-hint" class="hint">8文字以上。設定すると、そのユーザはログアウトされ、新しいパスワードで再ログインが必要になります</small>
          <div class="field-error" data-error-for="password" hidden></div>
        </div>
        <div class="field">
          <label for="pw-password-confirm">新しいパスワード（確認） <span class="required">必須</span></label>
          <input type="password" id="pw-password-confirm" name="password_confirm" autocomplete="new-password">
          <div class="field-error" data-error-for="password_confirm" hidden></div>
        </div>
        <div class="actions">
          <button type="submit" id="password-submit" class="btn btn-primary">設定</button>
          <button type="button" class="btn" data-close-dialog>キャンセル</button>
        </div>
      </form>
    </div>
  </dialog>
</body>
</html>
