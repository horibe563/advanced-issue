name: CI

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ main ]
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: コードをチェックアウト
        uses: actions/checkout@v4

      - name: Node.js をセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: 依存関係をインストール
        run: npm ci

      - name: Lint を実行
        run: npm run lint --if-present

      - name: テストを実行(カバレッジ計測付き)
        run: npm run test:ci

      - name: カバレッジレポートをアーティファクトとして保存
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7
